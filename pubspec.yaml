name: cloudvault_analyzer
description: CloudVault Analyzer - Multi-cloud storage analytics for Google Drive and OneDrive
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # OAuth 2.0 - PKCE on desktop, Google Sign-In on mobile, Apple Sign-In on iOS/macOS
  flutter_web_auth_2: ^4.0.0
  crypto: ^3.0.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.0.0

  # Secure Token Storage (Keychain/Keystore/Credential Manager)
  flutter_secure_storage: ^9.2.2

  # HTTP client with interceptors
  dio: ^5.4.3

  # Local SQLite database
  drift: ^2.22.0
  drift_flutter: ^0.2.7

  # Animated charts
  fl_chart: ^0.68.0

  # Export formats
  csv: ^6.0.0
  excel: ^4.0.3
  pdf: ^3.10.8
  printing: ^5.12.0

  # File sharing and picking
  share_plus: 12.0.2
  file_picker: ^8.0.0

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0

  # UI
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
